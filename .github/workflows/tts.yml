name: tts
# 대본(tts/<이름>.txt)을 마이크로소프트 한국어 목소리로 읽어 tts/<이름>.mp3 와 자막 타이밍(.vtt)을 만든다
on:
  workflow_dispatch:
    inputs:
      name:
        description: "tts/ 안의 대본 파일 이름 (확장자 빼고)"
        required: true
      voice:
        description: "목소리"
        default: "ko-KR-InJoonNeural"
      rate:
        description: "빠르기 (예: +10%)"
        default: "+8%"
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install edge-tts==7.0.2
      - run: |
          edge-tts --voice "${{ inputs.voice }}" --rate="${{ inputs.rate }}" \
            -f "tts/${{ inputs.name }}.txt" \
            --write-media "tts/${{ inputs.name }}.mp3" \
            --write-subtitles "tts/${{ inputs.name }}.vtt"
      - run: |
          git config user.name realmanbae183
          git config user.email realmanbae183@users.noreply.github.com
          git add tts/
          git commit -m "tts: ${{ inputs.name }}" && git pull --rebase && git push
